[project]
name = "llm_gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway (remote providers + local GPU/NPU runtime)"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["llm_gateway_docs_v2", "local_models", "storage", "logs"]

[tool.ruff.format]
# hasil autogenerate Alembic dibiarkan apa adanya (tetap di-lint)
exclude = ["migrations/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI memakai Depends() sebagai default argumen.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# revisi hasil autogenerate Alembic
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: butuh PostgreSQL (database llm_gateway_test)",
    "gpu: butuh iGPU + model OpenVINO nyata (jalankan dengan --hardware)",
    "npu: butuh NPU + model OpenVINO nyata (jalankan dengan --hardware)",
    "live: provider remote asli lewat gateway yang berjalan (jalankan dengan --live)",
    "load: load test overhead gateway (jalankan dengan --load)",
    "contract: SDK openai resmi ke server uvicorn sungguhan",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# TASK-20: fungsi wajib bertipe di lapisan service/utils gateway dan seluruh runtime
[[tool.mypy.overrides]]
module = ["app.services.*", "app.utils.*", "runtime.*"]
disallow_untyped_defs = true

[tool.coverage.run]
omit = ["tests/*", "migrations/*"]
