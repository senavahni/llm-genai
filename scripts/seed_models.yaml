# Katalog seed (PRD §7.4, §9.4, §9.5). Single source of truth runtime = tabel `models`;
# file ini hanya sumber seed awal / `manage.py seed --update-local`.
#
# Model lokal: hanya keluarga Qwen + Stable Diffusion v1.5, semuanya OpenVINO IR di GPU/NPU
# (keputusan 28 Okt 2026, lihat docs/hardware.md). Tidak ada inferensi di CPU.
# - hf_repo: repo IR siap pakai (diunduh scripts/download_models.py), atau repo sumber bila
#   `convert: true` (dibuat scripts/convert_openvino.py).
# - vram_mb: hasil ukur scripts/measure_models.py → `manage.py seed --update-local`.
# - Nama model remote & harga: cek dokumentasi provider saat implementasi; harga 0 = belum diisi.
# - File ini = FAKTA model (kemampuan, artefak) + katalog & route lengkap. Model mana yang aktif
#   dan ke mana route menunjuk diatur PROFIL operasional (scripts/profiles/*.yaml) lewat
#   `manage.py apply-profile`; `seed --update-local` tidak mengubah is_enabled kecuali ditulis
#   eksplisit di sini.

providers:
  - {code: openai, kind: remote, display_name: OpenAI, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  - {code: anthropic, kind: remote, display_name: Anthropic, base_url: "https://api.anthropic.com", api_key_env: ANTHROPIC_API_KEY}
  - {code: gemini, kind: remote, display_name: Google Gemini, base_url: "https://generativelanguage.googleapis.com", api_key_env: GEMINI_API_KEY}
  # base_url lokal diisi dari RUNTIME_URL saat seed. Semua model lokal lewat OpenVINO (GPU/NPU).
  - {code: openvino, kind: local, display_name: "OpenVINO (Local Runtime)", base_url: "${RUNTIME_URL}", api_key_env: RUNTIME_TOKEN, timeout_seconds: 300, max_concurrency: 4}
  # OpenRouter: hanya varian gratis (upstream_name berakhiran ":free"), lihat docs/openrouter/*.txt
  - {code: openrouter, kind: remote, display_name: OpenRouter, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, config: {adapter: openai, headers: {X-Title: llm-gateway}}}
  # Provider API lain (tak terbatas jumlahnya): pilih adapter yang formatnya cocok lewat
  # config.adapter (openai | anthropic | gemini). Key = NAMA env berpola *_API_KEY, nilai di .env.
  # Lebih praktis lewat Admin API (POST /admin/providers, lihat docs/admin-api.http). Contoh:
  # - {code: deepseek, kind: remote, display_name: DeepSeek, base_url: "https://api.deepseek.com/v1", api_key_env: DEEPSEEK_API_KEY, config: {adapter: openai}}
  # - {code: groq, kind: remote, display_name: Groq, base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY, config: {adapter: openai}}
  # - {code: openrouter, kind: remote, display_name: OpenRouter, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, config: {adapter: openai, headers: {X-Title: llm-gateway}}}
  # - {code: ollama-lan, kind: remote, display_name: Ollama LAN, base_url: "http://192.168.1.50:11434/v1", config: {adapter: openai, auth: none}}

models:
  # ===================== Model lokal (OpenVINO) =====================
  - alias: local/qwen2.5-7b
    provider: openvino
    upstream_name: qwen2.5-7b
    model_type: chat
    tier: heavy
    device: gpu
    runtime_backend: openvino_llm
    hf_repo: OpenVINO/Qwen2.5-7B-Instruct-int4-ov
    artifact_path: local_models/openvino/qwen2.5-7b-int4
    vram_mb: 4900
    artifact_sha256: a1311f69613dc126ef7ac9010e1634d286798822cbc5113c08c9e68d7ee64fae
    is_pinned: false
    license: apache-2.0
    supports_tools: true
    supports_json_mode: true
    context_window: 8192
    max_output_tokens: 4096
    config: {device: GPU, tool_parser: hermes, cache_dir: local_models/ov_cache}

  - alias: local/qwen2.5-coder-7b
    provider: openvino
    upstream_name: qwen2.5-coder-7b
    model_type: chat
    tier: heavy
    device: gpu
    runtime_backend: openvino_llm
    hf_repo: OpenVINO/Qwen2.5-Coder-7B-Instruct-int4-ov
    artifact_path: local_models/openvino/qwen2.5-coder-7b-int4
    vram_mb: 5000
    artifact_sha256: 72598a6ccbb787251e1e550750cad6162aeff7fa3c3d3905c9326ed7a1fc8fa0
    is_pinned: false
    license: apache-2.0
    supports_tools: true
    supports_json_mode: true
    context_window: 8192
    max_output_tokens: 4096
    config: {device: GPU, tool_parser: hermes, cache_dir: local_models/ov_cache}

  - alias: local/qwen2.5-coder-1.5b
    provider: openvino
    upstream_name: qwen2.5-coder-1.5b
    # chat + FIM + tools dari SATU salinan di NPU: melayani /v1/chat/completions (route code) dan
    # /v1/completions (autocomplete); template chat Qwen2.5 native mendukung tools (Hermes)
    model_type: chat
    tier: light
    device: npu
    runtime_backend: openvino_llm
    hf_repo: Qwen/Qwen2.5-Coder-1.5B-Instruct
    convert: true
    artifact_path: local_models/openvino/qwen2.5-coder-1.5b-int4-npu
    vram_mb: 2800
    artifact_sha256: 91b923db2ca875709d6c4595c23b5862a752631dae94b484ecfdfa93d4fe8299
    is_pinned: true
    supports_fim: true
    supports_tools: true
    license: apache-2.0
    context_window: 4096
    max_output_tokens: 1024
    config: {device: NPU, max_prompt_len: 2048, min_response_len: 256, prefill_chunk_size: 256,
             fim_max_prompt_tokens: 256,
             fim_template: "<|fim_prefix|>{prefix}<|fim_suffix|>{suffix}<|fim_middle|>",
             fim_stop: ["<|endoftext|>", "<|fim_pad|>", "<|file_sep|>"],
             cache_dir: local_models/ov_cache}

  - alias: local/qwen2-vl-2b
    provider: openvino
    upstream_name: qwen2-vl-2b
    model_type: chat
    tier: light
    device: gpu
    runtime_backend: openvino_vlm
    hf_repo: Qwen/Qwen2-VL-2B-Instruct
    convert: true
    artifact_path: local_models/openvino/qwen2-vl-2b-int4
    vram_mb: 2100
    artifact_sha256: cb743cc45ccc7e5c3ec764d20fe01c34d3e49b97ae0019b3c26f0987e9b07ff9
    is_pinned: false
    license: apache-2.0
    supports_vision: true
    # template Qwen2-VL tanpa bagian tools → backend merender Hermes manual (tool_prompt.py)
    supports_tools: true
    context_window: 4096
    max_output_tokens: 2048
    config: {device: GPU, tool_parser: hermes, max_image_px: 1280, max_images: 4,
             cache_dir: local_models/ov_cache}

  - alias: local/sd-1.5
    provider: openvino
    upstream_name: sd15
    model_type: image
    tier: heavy
    device: npu
    runtime_backend: openvino_diffusion
    hf_repo: stable-diffusion-v1-5/stable-diffusion-v1-5
    convert: true
    artifact_path: local_models/openvino/sd15-int8
    vram_mb: 3300
    artifact_sha256: 0003fe05c9352f11c680edac536367fa4a7b5bbdb2d05de35c45cb10fe631a6b
    is_pinned: true
    license: creativeml-openrail-m
    supports_streaming: false
    config: {device: NPU, component_devices: {text_encoder: NPU, unet: NPU, vae: NPU},
             tasks: [text-to-image, image-to-image], guidance_scale: 7.5,
             allowed_sizes: ["512x512"], default_steps: 25, max_steps: 50, default_strength: 0.6,
             cache_dir: local_models/ov_cache}

  # Embedding lokal v1.0.0 (LGW-V1-01/02): IR INT8 hasil spike (kesetaraan vs PyTorch: kosinus
  # rata-rata 0,9986, min 0,9972; lihat docs/hardware.md). Last-token pooling + L2 normalize di
  # TextEmbeddingPipeline; prefix instruksi query diterapkan Gateway. Selalu termuat (pinned).
  - alias: local/qwen3-embedding-0.6b
    provider: openvino
    upstream_name: qwen3-embedding-0.6b
    model_type: embedding
    tier: light
    device: gpu
    runtime_backend: openvino_embed
    hf_repo: Qwen/Qwen3-Embedding-0.6B
    convert: true
    artifact_path: local_models/openvino/qwen3-embedding-0.6b-int8
    # puncak terukur batch 8 × ±1.670 token = 1.274 MB (typeperf); 8 × 2.048 token ≈ 1.500 MB
    vram_mb: 1800
    artifact_sha256: 015dc031652b5bb77bc94485e803374dbcacff7d9adf21ff090679e086a7085e
    is_pinned: true
    license: apache-2.0
    supports_streaming: false
    embedding_dimensions: 1024
    context_window: 32768
    # max_batch 8: batch lebih besar tidak menambah token/s di iGPU (±420–440) tetapi memori naik
    # tajam (b32 × 1.670 token = 4.250 MB). Angka final dari benchmark LGW-V1-05.
    config: {device: GPU, pooling: last_token, max_batch: 8, max_input_tokens: 2048,
             cache_dir: local_models/ov_cache}

  # ===================== Remote (contoh) =====================
  # Harga USD per 1 juta token (halaman pricing resmi, Nov 2026); cached = harga cache hit/read.
  - {alias: anthropic/claude-sonnet, provider: anthropic, upstream_name: claude-sonnet-5-5, model_type: chat, tier: heavy,
     supports_tools: true, supports_vision: true, supports_json_mode: true, context_window: 200000, max_output_tokens: 16384,
     input_cost_per_mtok: 2.00, output_cost_per_mtok: 10.00, config: {cached_input_cost_per_mtok: 0.10}}
  # Haiku 5.5: tarif prompt <= 100K token; prompt > 100K ($0.50/$2.50) tidak dibedakan Gateway
  - {alias: anthropic/claude-haiku, provider: anthropic, upstream_name: claude-haiku-5-5, model_type: chat, tier: light,
     supports_tools: true, supports_vision: true, supports_json_mode: true, context_window: 200000, max_output_tokens: 8192,
     input_cost_per_mtok: 0.10, output_cost_per_mtok: 0.50, config: {cached_input_cost_per_mtok: 0.01}}
  - {alias: openai/gpt-heavy, provider: openai, upstream_name: gpt-5, model_type: chat, tier: heavy,
     supports_tools: true, supports_vision: true, supports_json_mode: true,
     input_cost_per_mtok: 1.25, output_cost_per_mtok: 10.00,
     config: {max_tokens_param: max_completion_tokens, drop_params: [temperature, top_p], cached_input_cost_per_mtok: 0.125}}
  - {alias: openai/gpt-light, provider: openai, upstream_name: gpt-5-mini, model_type: chat, tier: light,
     supports_tools: true, supports_vision: true, supports_json_mode: true,
     input_cost_per_mtok: 0.25, output_cost_per_mtok: 2.00,
     config: {max_tokens_param: max_completion_tokens, drop_params: [temperature, top_p], cached_input_cost_per_mtok: 0.025}}
  - {alias: openai/text-embedding-3-small, provider: openai, upstream_name: text-embedding-3-small, model_type: embedding,
     supports_streaming: false, embedding_dimensions: 1536, input_cost_per_mtok: 0.02, output_cost_per_mtok: 0}
  - {alias: openai/text-embedding-3-large, provider: openai, upstream_name: text-embedding-3-large, model_type: embedding,
     supports_streaming: false, embedding_dimensions: 3072, input_cost_per_mtok: 0.13, output_cost_per_mtok: 0}
  - {alias: gemini/flash, provider: gemini, upstream_name: gemini-2.5-flash, model_type: chat, tier: light,
     supports_tools: true, supports_vision: true, supports_json_mode: true}

  # ===================== OpenRouter (free) =====================
  # Hanya varian ":free" (harga 0). Kapabilitas = parameter yang didukung per docs/openrouter/*.txt
  # (tools → supports_tools, response_format → supports_json_mode). Panggil langsung lewat alias,
  # mis. model "openrouter/gemma-4-31b", atau route "openrouter/auto" (fallback antar model free).
  - {alias: openrouter/dots-3-note-preview, provider: openrouter, upstream_name: "dots-studio/dots-3-note-preview:free", model_type: chat, tier: light,
     supports_tools: true, supports_json_mode: true}
  - {alias: openrouter/gemma-4-26b-a4b, provider: openrouter, upstream_name: "google/gemma-4-26b-a4b-it:free", model_type: chat, tier: light,
     supports_tools: true, supports_json_mode: true}
  - {alias: openrouter/gemma-4-31b, provider: openrouter, upstream_name: "google/gemma-4-31b-it:free", model_type: chat, tier: light,
     supports_tools: true, supports_json_mode: true}
  - {alias: openrouter/lfm-2.5-2.6b, provider: openrouter, upstream_name: "liquid/lfm-2.5-2.6b:free", model_type: chat, tier: light,
     supports_tools: true, supports_json_mode: true}
  - {alias: openrouter/north-mini-code, provider: openrouter, upstream_name: "cohere/north-mini-code:free", model_type: chat, tier: light,
     supports_tools: true}
  - {alias: openrouter/nemotron-3-ultra, provider: openrouter, upstream_name: "nvidia/nemotron-3-ultra-550b-a55b:free", model_type: chat, tier: heavy,
     supports_tools: true}
  - {alias: openrouter/nemotron-3.5-super-vl, provider: openrouter, upstream_name: "nvidia/nemotron-3.5-super-vl:free", model_type: chat, tier: heavy,
     supports_tools: true, supports_json_mode: true}
  - {alias: openrouter/nemotron-3.5-lightning, provider: openrouter, upstream_name: "nvidia/nemotron-3.5-lightning:free", model_type: chat, tier: light,
     supports_tools: true}
  - {alias: openrouter/nemotron-3-nano-omni, provider: openrouter, upstream_name: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", model_type: chat, tier: light,
     supports_tools: true}
  - {alias: openrouter/nemotron-3.5-content-safety, provider: openrouter, upstream_name: "nvidia/nemotron-3.5-content-safety:free", model_type: chat, tier: light}
  - {alias: openrouter/flint-v1.0, provider: openrouter, upstream_name: "recursive/flint-v1.0:free", model_type: chat, tier: light,
     supports_tools: true, supports_json_mode: true}
  - {alias: openrouter/xing4.0-29b-a4b, provider: openrouter, upstream_name: "xingchen-agi/xing4.0-29b-a4b:free", model_type: chat, tier: light,
     supports_tools: true, supports_json_mode: true}

routes:
  - alias: fast
    description: task ringan
    targets: [{model: local/qwen2.5-7b, priority: 1}, {model: gemini/flash, priority: 2}]
  - alias: smart
    description: task berat / agent
    targets: [{model: anthropic/claude-sonnet, priority: 1}, {model: openai/gpt-heavy, priority: 2}, {model: local/qwen2.5-7b, priority: 3}]
  - alias: local
    description: lokal saja (privasi)
    targets: [{model: local/qwen2.5-7b, priority: 1}, {model: local/qwen2.5-coder-7b, priority: 2}]
  - alias: code
    description: chat/agent kode
    targets: [{model: local/qwen2.5-coder-7b, priority: 1}, {model: anthropic/claude-sonnet, priority: 2}, {model: local/qwen2.5-7b, priority: 3}]
  - alias: autocomplete
    description: FIM (pinned)
    targets: [{model: local/qwen2.5-coder-1.5b, priority: 1}]
  - alias: vision
    description: gambar -> teks
    targets: [{model: local/qwen2-vl-2b, priority: 1}, {model: openai/gpt-light, priority: 2}]
  - alias: image
    description: text-to-image & image-to-image
    targets: [{model: local/sd-1.5, priority: 1}]
  - alias: embed-default
    description: embeddings remote (1536 dim)
    targets: [{model: openai/text-embedding-3-small, priority: 1}]
  - alias: embed-local
    description: embeddings lokal GPU (1024 dim), tanpa fallback ke dimensi lain
    targets: [{model: local/qwen3-embedding-0.6b, priority: 1}]
  - alias: openrouter/auto
    description: semua model free OpenRouter, pindah otomatis kalau kena limit
    targets:
      - {model: openrouter/nemotron-3-ultra, priority: 1}
      - {model: openrouter/nemotron-3.5-super-vl, priority: 2}
      - {model: openrouter/gemma-4-31b, priority: 3}
      - {model: openrouter/xing4.0-29b-a4b, priority: 4}
      - {model: openrouter/gemma-4-26b-a4b, priority: 5}
      - {model: openrouter/nemotron-3-nano-omni, priority: 6}
      - {model: openrouter/nemotron-3.5-lightning, priority: 7}
      - {model: openrouter/flint-v1.0, priority: 8}
      - {model: openrouter/dots-3-note-preview, priority: 9}
      - {model: openrouter/north-mini-code, priority: 10}
      - {model: openrouter/lfm-2.5-2.6b, priority: 11}
