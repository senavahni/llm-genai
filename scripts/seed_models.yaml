# Katalog seed (PRD §7.4, §9.4, §9.5). Single source of truth runtime = tabel `models`;
# file ini hanya sumber seed awal / `manage.py seed --update-local`.
#
# Model lokal: hanya keluarga Qwen + Stable Diffusion v1.5, semuanya OpenVINO IR di GPU/NPU
# (keputusan 28 Okt 2026, lihat docs/hardware.md). Tidak ada inferensi di CPU.
# - hf_repo: repo IR siap pakai (diunduh scripts/download_models.py), atau repo sumber bila
#   `convert: true` (dibuat scripts/convert_openvino.py).
# - vram_mb: hasil ukur scripts/measure_models.py → `manage.py seed --update-local`.
# - Nama model remote & harga: cek dokumentasi provider saat implementasi; harga 0 = belum diisi.

providers:
  - {code: openai, kind: remote, display_name: OpenAI, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  - {code: anthropic, kind: remote, display_name: Anthropic, base_url: "https://api.anthropic.com", api_key_env: ANTHROPIC_API_KEY}
  - {code: gemini, kind: remote, display_name: Google Gemini, base_url: "https://generativelanguage.googleapis.com", api_key_env: GEMINI_API_KEY}
  # base_url lokal diisi dari RUNTIME_URL saat seed. Semua model lokal lewat OpenVINO (GPU/NPU).
  - {code: openvino, kind: local, display_name: "OpenVINO (Local Runtime)", base_url: "${RUNTIME_URL}", api_key_env: RUNTIME_TOKEN, timeout_seconds: 300, max_concurrency: 4}

models:
  # ===================== Model lokal (OpenVINO) =====================
  - alias: local/qwen2.5-7b
    provider: openvino
    upstream_name: qwen2.5-7b
    model_type: chat
    tier: heavy
    device: gpu
    runtime_backend: openvino_llm
    hf_repo: OpenVINO/Qwen2.5-7B-Instruct-int4-ov
    artifact_path: local_models/openvino/qwen2.5-7b-int4
    vram_mb: 4900
    artifact_sha256: a1311f69613dc126ef7ac9010e1634d286798822cbc5113c08c9e68d7ee64fae
    is_pinned: false
    license: apache-2.0
    supports_tools: true
    supports_json_mode: true
    context_window: 8192
    max_output_tokens: 4096
    config: {device: GPU, tool_parser: hermes, cache_dir: local_models/ov_cache}

  - alias: local/qwen2.5-coder-7b
    provider: openvino
    upstream_name: qwen2.5-coder-7b
    model_type: chat
    tier: heavy
    device: gpu
    runtime_backend: openvino_llm
    hf_repo: OpenVINO/Qwen2.5-Coder-7B-Instruct-int4-ov
    artifact_path: local_models/openvino/qwen2.5-coder-7b-int4
    vram_mb: 5000
    artifact_sha256: 72598a6ccbb787251e1e550750cad6162aeff7fa3c3d3905c9326ed7a1fc8fa0
    is_pinned: false
    license: apache-2.0
    supports_tools: true
    supports_json_mode: true
    context_window: 8192
    max_output_tokens: 4096
    config: {device: GPU, tool_parser: hermes, cache_dir: local_models/ov_cache}

  - alias: local/qwen2.5-coder-1.5b
    provider: openvino
    upstream_name: qwen2.5-coder-1.5b
    model_type: completion
    tier: light
    device: npu
    runtime_backend: openvino_llm
    hf_repo: Qwen/Qwen2.5-Coder-1.5B-Instruct
    convert: true
    artifact_path: local_models/openvino/qwen2.5-coder-1.5b-int4-npu
    vram_mb: 2800
    artifact_sha256: 91b923db2ca875709d6c4595c23b5862a752631dae94b484ecfdfa93d4fe8299
    is_pinned: true
    supports_fim: true
    license: apache-2.0
    context_window: 4096
    max_output_tokens: 1024
    config: {device: NPU, max_prompt_len: 2048, min_response_len: 256,
             fim_template: "<|fim_prefix|>{prefix}<|fim_suffix|>{suffix}<|fim_middle|>",
             fim_stop: ["<|endoftext|>", "<|fim_pad|>", "<|file_sep|>"],
             cache_dir: local_models/ov_cache}

  - alias: local/qwen2-vl-2b
    provider: openvino
    upstream_name: qwen2-vl-2b
    model_type: chat
    tier: light
    device: gpu
    runtime_backend: openvino_vlm
    hf_repo: Qwen/Qwen2-VL-2B-Instruct
    convert: true
    artifact_path: local_models/openvino/qwen2-vl-2b-int4
    vram_mb: 2100
    artifact_sha256: cb743cc45ccc7e5c3ec764d20fe01c34d3e49b97ae0019b3c26f0987e9b07ff9
    is_pinned: false
    license: apache-2.0
    supports_vision: true
    context_window: 4096
    max_output_tokens: 2048
    config: {device: GPU, max_image_px: 1280, max_images: 4, cache_dir: local_models/ov_cache}

  - alias: local/sd-1.5
    provider: openvino
    upstream_name: sd15
    model_type: image
    tier: heavy
    device: npu
    runtime_backend: openvino_diffusion
    hf_repo: stable-diffusion-v1-5/stable-diffusion-v1-5
    convert: true
    artifact_path: local_models/openvino/sd15-int8
    vram_mb: 3300
    artifact_sha256: 0003fe05c9352f11c680edac536367fa4a7b5bbdb2d05de35c45cb10fe631a6b
    is_pinned: true
    license: creativeml-openrail-m
    supports_streaming: false
    config: {device: NPU, component_devices: {text_encoder: NPU, unet: NPU, vae: NPU},
             tasks: [text-to-image, image-to-image], guidance_scale: 7.5,
             allowed_sizes: ["512x512"], default_steps: 25, max_steps: 50, default_strength: 0.6,
             cache_dir: local_models/ov_cache}

  # ===================== Remote (contoh) =====================
  - {alias: anthropic/claude-sonnet, provider: anthropic, upstream_name: claude-sonnet-5-5, model_type: chat, tier: heavy,
     supports_tools: true, supports_vision: true, supports_json_mode: true, context_window: 200000, max_output_tokens: 16384}
  - {alias: anthropic/claude-haiku, provider: anthropic, upstream_name: claude-haiku-5-5, model_type: chat, tier: light,
     supports_tools: true, supports_vision: true, supports_json_mode: true, context_window: 200000, max_output_tokens: 8192}
  - {alias: openai/gpt-heavy, provider: openai, upstream_name: gpt-5, model_type: chat, tier: heavy,
     supports_tools: true, supports_vision: true, supports_json_mode: true}
  - {alias: openai/gpt-light, provider: openai, upstream_name: gpt-5-mini, model_type: chat, tier: light,
     supports_tools: true, supports_vision: true, supports_json_mode: true}
  - {alias: openai/text-embedding-3-small, provider: openai, upstream_name: text-embedding-3-small, model_type: embedding,
     supports_streaming: false, embedding_dimensions: 1536}
  - {alias: gemini/flash, provider: gemini, upstream_name: gemini-2.5-flash, model_type: chat, tier: light,
     supports_tools: true, supports_vision: true, supports_json_mode: true}

routes:
  - alias: fast
    description: task ringan
    targets: [{model: local/qwen2.5-7b, priority: 1}, {model: gemini/flash, priority: 2}]
  - alias: smart
    description: task berat / agent
    targets: [{model: anthropic/claude-sonnet, priority: 1}, {model: openai/gpt-heavy, priority: 2}, {model: local/qwen2.5-7b, priority: 3}]
  - alias: local
    description: lokal saja (privasi)
    targets: [{model: local/qwen2.5-7b, priority: 1}, {model: local/qwen2.5-coder-7b, priority: 2}]
  - alias: code
    description: chat/agent kode
    targets: [{model: local/qwen2.5-coder-7b, priority: 1}, {model: anthropic/claude-sonnet, priority: 2}, {model: local/qwen2.5-7b, priority: 3}]
  - alias: autocomplete
    description: FIM (pinned)
    targets: [{model: local/qwen2.5-coder-1.5b, priority: 1}]
  - alias: vision
    description: gambar -> teks
    targets: [{model: local/qwen2-vl-2b, priority: 1}, {model: openai/gpt-light, priority: 2}]
  - alias: image
    description: text-to-image & image-to-image
    targets: [{model: local/sd-1.5, priority: 1}]
  - alias: embed-default
    description: embeddings (tidak ada embedding lokal)
    targets: [{model: openai/text-embedding-3-small, priority: 1}]
